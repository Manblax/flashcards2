name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Backend
            path: backend
            lockfile: backend/package-lock.json
            test-command: npm test -- --runInBand
          - name: Dictionary Service
            path: dictionary-service
            lockfile: dictionary-service/package-lock.json
            test-command: npm test -- --runInBand
          - name: Frontend
            path: frontend
            lockfile: frontend/package-lock.json
            test-command: npm test
    env:
      DATABASE_URL: postgresql://myuser:mypassword@localhost:5432/flashcards_db
      JWT_SECRET: ci-jwt-secret
      FRONTEND_URL: http://localhost:3000
      GOOGLE_CALLBACK_URL: http://localhost:3001/auth/google/callback
      DICTIONARY_SERVICE_URL: http://localhost:4000
      NEXT_PUBLIC_API_URL: http://localhost:3001
      INTERNAL_API_URL: http://localhost:3001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.path }}

      - name: Generate Prisma client
        if: ${{ matrix.path == 'backend' }}
        run: npx prisma generate
        working-directory: ${{ matrix.path }}

      - name: Build
        run: npm run build
        working-directory: ${{ matrix.path }}

      - name: Test
        run: ${{ matrix.test-command }}
        working-directory: ${{ matrix.path }}

  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    needs: ci
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      INTERNAL_API_URL: http://localhost:3001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
